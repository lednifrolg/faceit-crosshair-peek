name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version src/manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/manifest.json version $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_ENV"

      - name: Build zip
        run: |
          mkdir -p dist/pkg
          cp -r src/. dist/pkg/
          cp LICENSE dist/pkg/
          cd dist/pkg
          zip -qr "../faceit-crosshair-peek-v${version}.zip" .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/faceit-crosshair-peek-v${{ env.version }}.zip
          generate_release_notes: true
